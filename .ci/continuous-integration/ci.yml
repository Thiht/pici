name: continuous-integration

steps:
  - name: build
    run: |
      go build -o dist/pici ./cmd/pici
      go build -o dist/pici-cli ./cmd/pici-cli
    timeout: 10m
    artifacts:
      - dist/**

  - name: fmt-check
    run: task fmt:check
    depends_on: [build]
    timeout: 10m

  - name: lint
    run: task lint
    depends_on: [build]
    timeout: 10m

  - name: test
    run: task test
    depends_on: [build]
    timeout: 10m
