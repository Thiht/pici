name: continuous-integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

steps:
  - name: build
    run: task build VERSION="$PICI_VERSION"
    timeout: 10m
    artifacts:
      - dist/**

  - name: fmt-check
    run: task fmt:check
    depends_on: [build]
    timeout: 10m

  - name: lint
    run: task lint
    depends_on: [build]
    timeout: 10m

  - name: test
    run: task test
    depends_on: [build]
    timeout: 10m

  - name: test-postgres
    run: task test:postgres
    docker: true
    depends_on: [build]
    timeout: 10m
