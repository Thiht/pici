name: test

env:
  GOMODCACHE: /workspace/.cache/gomod

cache:
  - .cache/gomod

steps:
  - name: build
    run: task build
    timeout: 10m

  - name: fmt-check
    run: task fmt-check
    depends_on: [build]
    timeout: 10m

  - name: lint
    run: task lint
    depends_on: [build]
    timeout: 10m

  - name: test
    run: task test
    depends_on: [build]
    timeout: 10m
