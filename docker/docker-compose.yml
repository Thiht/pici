name: pici

services:
  pici:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    privileged: true
    stop_grace_period: 2m
    environment:
      PICI_DB_DSN: /data/pici.db
      PICI_WORKSPACE_DIR: /data/workspaces
      PICI_SECRET_KEY: ${PICI_SECRET_KEY:?PICI_SECRET_KEY is required}
      PICI_PUBLIC_URL: ${PICI_PUBLIC_URL:?PICI_PUBLIC_URL is required}
      PICI_GITHUB_CLIENT_ID: ${PICI_GITHUB_CLIENT_ID:?PICI_GITHUB_CLIENT_ID is required}
      PICI_GITHUB_CLIENT_SECRET: ${PICI_GITHUB_CLIENT_SECRET:?PICI_GITHUB_CLIENT_SECRET is required}
      # Set at least one of PICI_GITHUB_TEAMS or PICI_GITHUB_USERS.
      PICI_GITHUB_TEAMS: ${PICI_GITHUB_TEAMS:-}
      PICI_GITHUB_USERS: ${PICI_GITHUB_USERS:-}
    ports:
      - "${PICI_PORT:-8080}:8080"
    volumes:
      - pici-data:/data

volumes:
  pici-data:
