name: pici

services:
  pici:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    privileged: true
    stop_grace_period: 2m
    environment:
      PICI_DB_DSN: /data/pici.db
      PICI_WORKSPACE_DIR: /data/workspaces
      PICI_SECRET_KEY: ${PICI_SECRET_KEY:?PICI_SECRET_KEY is required}
      PICI_PUBLIC_URL: ${PICI_PUBLIC_URL:?PICI_PUBLIC_URL is required}
      PICI_AUTH_PROVIDER: ${PICI_AUTH_PROVIDER:-github}
      # With PICI_AUTH_PROVIDER=github, set the client id/secret and at least
      # one of PICI_GITHUB_TEAMS or PICI_GITHUB_USERS.
      PICI_GITHUB_CLIENT_ID: ${PICI_GITHUB_CLIENT_ID:-}
      PICI_GITHUB_CLIENT_SECRET: ${PICI_GITHUB_CLIENT_SECRET:-}
      PICI_GITHUB_TEAMS: ${PICI_GITHUB_TEAMS:-}
      PICI_GITHUB_USERS: ${PICI_GITHUB_USERS:-}
      # With PICI_AUTH_PROVIDER=gitlab, set the client id/secret and at least
      # one of PICI_GITLAB_GROUPS or PICI_GITLAB_USERS.
      PICI_GITLAB_URL: ${PICI_GITLAB_URL:-https://gitlab.com}
      PICI_GITLAB_CLIENT_ID: ${PICI_GITLAB_CLIENT_ID:-}
      PICI_GITLAB_CLIENT_SECRET: ${PICI_GITLAB_CLIENT_SECRET:-}
      PICI_GITLAB_GROUPS: ${PICI_GITLAB_GROUPS:-}
      PICI_GITLAB_USERS: ${PICI_GITLAB_USERS:-}
      # With PICI_AUTH_PROVIDER=oidc, set the issuer, client id/secret and at
      # least one of PICI_OIDC_GROUPS or PICI_OIDC_USERS.
      PICI_OIDC_ISSUER: ${PICI_OIDC_ISSUER:-}
      PICI_OIDC_CLIENT_ID: ${PICI_OIDC_CLIENT_ID:-}
      PICI_OIDC_CLIENT_SECRET: ${PICI_OIDC_CLIENT_SECRET:-}
      PICI_OIDC_GROUPS: ${PICI_OIDC_GROUPS:-}
      PICI_OIDC_USERS: ${PICI_OIDC_USERS:-}
      PICI_OIDC_SCOPES: ${PICI_OIDC_SCOPES:-}
      PICI_OIDC_NAME: ${PICI_OIDC_NAME:-}
    ports:
      - "${PICI_PORT:-8080}:8080"
    volumes:
      - pici-data:/data

volumes:
  pici-data:
