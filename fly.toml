# Fly.io configuration for pici. See docs/guide/fly.md.
#
# The app name is set by `fly deploy --app <name>` (or by `fly launch`), so it
# is intentionally omitted here to keep this file reusable.
primary_region = "cdg"

kill_signal = "SIGINT"
kill_timeout = 120

[build]
  dockerfile = "docker/Dockerfile"

[env]
  PICI_DB_DSN = "/data/pici.db"
  PICI_WORKSPACE_DIR = "/data/workspaces"
  PICI_CONCURRENCY = "2"
  PICI_SHUTDOWN_TIMEOUT = "2m"
  # A Fly Machine can only mount one volume. Keep the Docker image/build cache
  # on the same /data volume as the database and workspaces.
  DOCKER_DATA_ROOT = "/data/docker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "pici_data"
  destination = "/data"
  initial_size = "30gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
