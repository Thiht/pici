version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (*archive/tar.Writer).Close
        - (*io.PipeWriter).Close
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/Thiht/pici
