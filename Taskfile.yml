version: "3"

vars:
  PKG: ./...
  GCL_VERSION: v2.14.0
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GOBIN:
    sh: |
      if [ -n "$(go env GOBIN)" ]; then echo "$(go env GOBIN)"; else echo "$(go env GOPATH)/bin"; fi
  REFLEX: "{{.GOBIN}}/reflex"
  GCL: "{{.GOBIN}}/golangci-lint"
  PRETTIER: node_modules/.bin/prettier
  DJLINT: .venv-djlint/bin/djlint

tasks:
  default:
    desc: Build and test
    deps: [build, test]

  build:
    desc: Build all packages
    cmds:
      - go build {{.PKG}}
      - go build -ldflags "-X main.buildVersion={{.VERSION}}" -o dist/pici ./cmd/pici
      - go build -ldflags "-X main.buildVersion={{.VERSION}}" -o dist/pici-cli ./cmd/pici-cli

  test:
    desc: Run tests
    cmds:
      - go test {{.PKG}}

  lint:
    desc: Run golangci-lint
    deps: [gcl:install]
    cmds:
      - "{{.GCL}} run"

  gcl:install:
    desc: Install golangci-lint
    status:
      - test -x {{.GCL}}
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GCL_VERSION}}

  fmt:
    desc: Format code (gofmt, goimports, gofumpt, prettier, djlint)
    deps: [prettier:install, djlint:install, gcl:install]
    cmds:
      - "{{.GCL}} fmt"
      - '{{.PRETTIER}} --write "**/*.{md,yml,yaml,json,css,js,mjs,vue}"'
      - "{{.DJLINT}} --reformat internal/web/templates"

  fmt:check:
    desc: Check formatting without modifying files
    deps: [prettier:install, djlint:install, gcl:install]
    cmds:
      - "{{.GCL}} fmt --diff"
      - '{{.PRETTIER}} --check "**/*.{md,yml,yaml,json,css,js,mjs,vue}"'
      - "{{.DJLINT}} --check internal/web/templates"

  prettier:install:
    desc: Install prettier
    status:
      - test -x {{.PRETTIER}}
    cmds:
      - npm install

  djlint:install:
    desc: Install djlint (Go html/template formatter)
    status:
      - test -x {{.DJLINT}}
    cmds:
      - python3 -m venv .venv-djlint
      - .venv-djlint/bin/pip install --quiet --upgrade djlint

  check:
    desc: Format check, lint and test
    deps: [fmt:check, lint, test]

  run:
    desc: Run the server
    cmds:
      - go run ./cmd/pici {{.CLI_ARGS}}

  start:
    aliases:
      - serve
      - start
      - watch
    desc: Run the server with live reload
    deps:
      - reflex:install
    cmds:
      - |
        {{ .REFLEX }} --start-service \
          --decoration='none' \
          --regex='\.(go|html|css)$$' \
          -- go run ./cmd/pici {{.CLI_ARGS}}

  reflex:install:
    desc: Install reflex
    status:
      - test -x {{ .REFLEX }}
    cmds:
      - go install github.com/cespare/reflex@latest

  cli:
    desc: Run the CLI client
    cmds:
      - go run ./cmd/pici-cli {{.CLI_ARGS}}

  ui:install:
    desc: Install the UI build dependencies (Tailwind, daisyUI, htmx)
    dir: internal/web
    cmds:
      - npm install

  ui:build:
    desc: Build the embedded UI assets (app.css and htmx)
    dir: internal/web
    deps: [ui:install]
    cmds:
      - cp node_modules/htmx.org/dist/htmx.min.js static/htmx.min.js
      - npx @tailwindcss/cli -i input.css -o static/app.css --minify

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -f docker/Dockerfile -t pici:dev .

  docker:up:
    desc: Start pici with docker-compose
    cmds:
      - docker compose -f docker/docker-compose.yml up --build

  docker:down:
    desc: Stop docker-compose
    cmds:
      - docker compose -f docker/docker-compose.yml down

  docs:install:
    desc: Install docs dependencies
    dir: docs
    cmds:
      - npm install

  docs:dev:
    desc: Serve docs locally
    dir: docs
    cmds:
      - npm run dev

  docs:build:
    desc: Build docs
    dir: docs
    cmds:
      - npm run build
