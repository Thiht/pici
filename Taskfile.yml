version: '3'

vars:
  PKG: ./...
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  REFLEX:
    sh: |
      if [ -n "$(go env GOBIN)" ]; then echo "$(go env GOBIN)/reflex"; else echo "$(go env GOPATH)/bin/reflex"; fi

tasks:
  default:
    desc: Build and test
    deps: [build, test]

  build:
    desc: Build all packages
    cmds:
      - go build {{.PKG}}
      - go build -ldflags "-X main.buildVersion={{.VERSION}}" -o dist/pici ./cmd/pici
      - go build -ldflags "-X main.buildVersion={{.VERSION}}" -o dist/pici-cli ./cmd/pici-cli

  test:
    desc: Run tests
    cmds:
      - go test {{.PKG}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format code (gofmt, goimports, gofumpt)
    cmds:
      - golangci-lint fmt

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - golangci-lint fmt --diff

  check:
    desc: Format check, lint and test
    deps: [fmt:check, lint, test]

  run:
    desc: Run the server
    cmds:
      - go run ./cmd/pici {{.CLI_ARGS}}

  start:
    aliases:
      - serve
      - start
      - watch
    desc: Run the server with live reload
    deps:
      - reflex:install
    cmds:
      - |
        {{ .REFLEX }} --start-service \
          --decoration='none' \
          --regex='\.(go|html|css)$$' \
          -- go run ./cmd/pici {{.CLI_ARGS}}

  reflex:install:
    desc: Install reflex
    status:
      - test -x {{ .REFLEX }}
    cmds:
      - go install github.com/cespare/reflex@latest

  cli:
    desc: Run the CLI client
    cmds:
      - go run ./cmd/pici-cli {{.CLI_ARGS}}

  ui:install:
    desc: Install the UI build dependencies (Tailwind, daisyUI, htmx)
    dir: internal/web
    cmds:
      - npm install

  ui:build:
    desc: Build the embedded UI assets (app.css and htmx)
    dir: internal/web
    deps: [ui:install]
    cmds:
      - cp node_modules/htmx.org/dist/htmx.min.js static/htmx.min.js
      - npx @tailwindcss/cli -i input.css -o static/app.css --minify

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -f docker/Dockerfile -t pici:dev .

  docker:up:
    desc: Start pici with docker-compose
    cmds:
      - docker compose -f docker/docker-compose.yml up --build

  docker:down:
    desc: Stop docker-compose
    cmds:
      - docker compose -f docker/docker-compose.yml down

  docs:install:
    desc: Install docs dependencies
    dir: docs
    cmds:
      - npm install

  docs:dev:
    desc: Serve docs locally
    dir: docs
    cmds:
      - npm run dev

  docs:build:
    desc: Build docs
    dir: docs
    cmds:
      - npm run build
